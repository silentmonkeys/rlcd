name: Build & Release Firmware

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP-IDF Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware and merge into one flashable image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          command: >
            idf.py build &&
            idf.py merge-bin
            --output rlcd_home_full.bin
            0x0 bootloader/bootloader.bin
            0x8000 partition_table/partition-table.bin
            0x20000 rlcd_home.bin
            0x420000 fonts.bin &&
            ls -lh build/rlcd_home_full.bin

      - name: Upload merged firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: rlcd_home_full
          path: build/rlcd_home_full.bin
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download merged firmware
        uses: actions/download-artifact@v4
        with:
          name: rlcd_home_full
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/rlcd_home_full.bin "release/rlcd_home_${{ github.ref_name }}_full.bin"
          ls -lh release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RLCD 固件 ${{ github.ref_name }}"
          body_path: .github/release_notes.md
          files: |
            release/*.bin
          fail_on_unmatched_files: false
          make_latest: true
