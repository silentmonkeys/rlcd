name: Build & Release Firmware

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP-IDF Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware and merge into one flashable image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: esp32s3
          command: >
            idf.py build &&
            idf.py merge-bin --output rlcd_home_full.bin &&
            ls -lh build/rlcd_home_full.bin build/rlcd_home.bin

      # 两个产物：full = 整片烧写镜像（含 bootloader/分区表/字库）；app = 仅应用分区，用于门户 OTA
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rlcd_home_bins
          path: |
            build/rlcd_home_full.bin
            build/rlcd_home.bin
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: rlcd_home_bins
          path: dist

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # 整片烧写镜像（0x0 起，含 bootloader/分区表/字库）
          cp dist/rlcd_home_full.bin "release/rlcd_home_${{ github.ref_name }}_full.bin"
          # 仅应用分区镜像（烧 0x20000，或门户网页 OTA 上传用）
          cp dist/rlcd_home.bin "release/rlcd_home_${{ github.ref_name }}_app.bin"
          sha256sum release/*.bin > release/SHA256SUMS.txt
          ls -lh release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RLCD 固件 ${{ github.ref_name }}"
          body_path: .github/release_notes.md
          files: |
            release/*.bin
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
          make_latest: true
